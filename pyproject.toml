[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csss441-book-catalog"
version = "1.0.0"
description = "FastAPI Target Application for DevSecOps Security Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hannah Amoaba Larbi" },
    { name = "Stephen Kwadwo Duah" },
    { name = "Othniel Kpakpo Saka" },
    { name = "Fred Nkrumah" },
    { name = "Benjamin Essibo Ofori" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".semgrep",
    "tests/semgrep",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "S",
]
ignore = [
    "S101",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"scripts/**" = ["S101", "S110", "S603", "S607", "E402", "E501", "I001"]
"app/models.py" = ["E501"]
"app/schemas.py" = ["E501"]
"app/main.py" = ["E501"]
"app/services/**" = ["E501", "S110"]
"app/routers/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
