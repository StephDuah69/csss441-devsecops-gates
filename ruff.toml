target-version = "py313"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security checks)
]
ignore = [
    "S101",   # allow assert in pytest test files
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # Assertions and dummy tokens in tests

[format]
quote-style = "double"
indent-style = "space"
