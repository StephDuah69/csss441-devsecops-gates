name: "Protected Release & Provenance Pipeline"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release semantic version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build, Sign & Attest Container Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Target
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/csss441-book-catalog"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and Push Immutable Container Image
        id: build-push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Extract Immutable Image Digest
        id: digest
        run: |
          RAW_DIGEST="${{ steps.build-push.outputs.digest }}"
          IMAGE_REF="${{ steps.meta.outputs.image }}@${RAW_DIGEST}"
          echo "digest=$RAW_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Target Image Ref: $IMAGE_REF"

      # ----------------------------------------------------------------------
      # Cryptographic Signing (Sigstore Cosign Keyless OIDC)
      # ----------------------------------------------------------------------
      - name: Sign Container Digest with Keyless Cosign
        env:
          COSIGN_YES: "true"
        run: |
          echo "Signing exact immutable digest with GitHub Actions OIDC identity..."
          cosign sign --yes "${{ steps.digest.outputs.image_ref }}"

      # ----------------------------------------------------------------------
      # SLSA Build Provenance Attestation
      # ----------------------------------------------------------------------
      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@c074443f1a5fb4a47738f8286a11e138a34d3148 # v2.2.3
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # ----------------------------------------------------------------------
      # Pre-Deployment Security Gate Verification
      # ----------------------------------------------------------------------
      - name: Verify Signature and Provenance Before Release Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executing release verification gate script..."
          bash scripts/verify_release.sh \
            "${{ steps.digest.outputs.image_ref }}" \
            "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            "https://token.actions.githubusercontent.com"

      - name: Release Approval Notification
        run: |
          echo "============================================================"
          echo "RELEASE DEPLOYMENT APPROVED"
          echo "Artifact: ${{ steps.digest.outputs.image_ref }}"
          echo "Signature & SLSA Provenance Verified."
          echo "============================================================"
